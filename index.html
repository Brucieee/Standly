<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/icons/layout-list" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Standly | Daily Standups</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #E2E8F0; /* Neomorphism base gray */
        color: #475569; /* slate-600 */
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'neo-base': '#E2E8F0', // Match base bg
            },
            boxShadow: {
              'neo': '7px 7px 15px -5px #a6abb1, -7px -7px 15px -5px #ffffff',
              'neo-inner': 'inset 5px 5px 10px -5px #a6abb1, inset -5px -5px 10px -5px #ffffff',
              'neo-sm': '4px 4px 8px -3px #a6abb1, -4px -4px 8px -3px #ffffff',
              'neo-sm-inner': 'inset 4px 4px 8px -3px #a6abb1, inset -4px -4px 8px -3px #ffffff',
            }
          }
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.24.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
